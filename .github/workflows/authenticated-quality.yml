name: Authenticated quality
on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * 1-5"
jobs:
  authenticated-smoke:
    runs-on: ubuntu-latest
    env:
      FLOWOPS_REMOTE_E2E_URL: https://rainbow-lokum-1fad14.netlify.app
      FLOWOPS_E2E_EMAIL: ${{ secrets.FLOWOPS_E2E_EMAIL }}
      FLOWOPS_E2E_PASSWORD: ${{ secrets.FLOWOPS_E2E_PASSWORD }}
      FLOWOPS_E2E_TENANT_NAME: ${{ secrets.FLOWOPS_E2E_TENANT_NAME }}
      FLOWOPS_E2E_FORBIDDEN_TEXT: ${{ secrets.FLOWOPS_E2E_FORBIDDEN_TEXT }}
      FLOWOPS_E2E_MARKETPLACE_ITEM_ID: ${{ secrets.FLOWOPS_E2E_MARKETPLACE_ITEM_ID }}
      FLOWOPS_E2E_MARKETPLACE_ORDER_ID: ${{ secrets.FLOWOPS_E2E_MARKETPLACE_ORDER_ID }}
      FLOWOPS_E2E_LOGISTICS_ORDER_ID: ${{ secrets.FLOWOPS_E2E_LOGISTICS_ORDER_ID }}
      FLOWOPS_E2E_TRACKING_TOKEN: ${{ secrets.FLOWOPS_E2E_TRACKING_TOKEN }}
      FLOWOPS_E2E_REALTIME_ORDER_ID: ${{ secrets.FLOWOPS_E2E_REALTIME_ORDER_ID }}
      FLOWOPS_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/flowops-release-evidence
    steps:
      - uses: actions/checkout@v4
      - name: Validate required credentials
        run: |
          test -n "$FLOWOPS_E2E_EMAIL" || (echo "FLOWOPS_E2E_EMAIL ausente" && exit 1)
          test -n "$FLOWOPS_E2E_PASSWORD" || (echo "FLOWOPS_E2E_PASSWORD ausente" && exit 1)
          test -n "$FLOWOPS_E2E_TENANT_NAME" || (echo "FLOWOPS_E2E_TENANT_NAME ausente" && exit 1)
          test -n "$FLOWOPS_E2E_FORBIDDEN_TEXT" || (echo "FLOWOPS_E2E_FORBIDDEN_TEXT ausente" && exit 1)
          test -n "$FLOWOPS_E2E_MARKETPLACE_ITEM_ID" || (echo "FLOWOPS_E2E_MARKETPLACE_ITEM_ID ausente" && exit 1)
          test -n "$FLOWOPS_E2E_MARKETPLACE_ORDER_ID" || (echo "FLOWOPS_E2E_MARKETPLACE_ORDER_ID ausente" && exit 1)
          test -n "$FLOWOPS_E2E_LOGISTICS_ORDER_ID" || (echo "FLOWOPS_E2E_LOGISTICS_ORDER_ID ausente" && exit 1)
          test -n "$FLOWOPS_E2E_TRACKING_TOKEN" || (echo "FLOWOPS_E2E_TRACKING_TOKEN ausente" && exit 1)
          test -n "$FLOWOPS_E2E_REALTIME_ORDER_ID" || (echo "FLOWOPS_E2E_REALTIME_ORDER_ID ausente" && exit 1)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/playwright-release-evidence.mjs --scope=authenticated
      - run: node scripts/playwright-release-evidence.mjs --scope=integrations
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: authenticated-playwright-report
          path: ${{ runner.temp }}/flowops-release-evidence
          retention-days: 14
